<div class="container mt-5">
    <div class="row">
      <div class="col-12 text-center mb-4">
        <h1 class="display-4">Localização dos Museus</h1>
      </div>
      <div class="col-12 mb-4">
        <select class="form-select" (change)="onMuseumChange($event)">
          <option value="" selected disabled>Selecione um Museu</option>
          <option *ngFor="let museum of museums" [value]="museum.name">{{ museum.name }}</option>
        </select>
      </div>
      <div class="col-12 mb-4">
        <div id="map" class="map-container"></div>
      </div>
      <div class="col-12">
        <div *ngIf="selectedMuseum">
          <h2>{{ selectedMuseum.name }}</h2>
          <p><strong>Endereço:</strong> {{ selectedMuseum.address }}</p>
          <p><strong>Horário de Funcionamento:</strong> {{ selectedMuseum.hours }}</p>
          <p><strong>Descrição:</strong> {{ selectedMuseum.description }}</p>
        </div>
      </div>
    </div>
  </div>
