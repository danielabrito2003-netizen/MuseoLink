<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Museum Gallery</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/5.1.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="title">
        <h3>The Metropolitan Museum of Art</h3>
    </div>
    <div id="carouselExampleControls1" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="assets/images/The-Metropolitan-Museum-of-Art/the-metropolitan-Museum-of-art.png"  class="d-block w-100 carousel-img">
            </div>
            <div class="carousel-item">
                <img src="assets/images/The-Metropolitan-Museum-of-Art/metropolitan-museum-of-art-new-york-city.png" class="d-block w-100 carousel-img">
            </div>
            <div class="carousel-item">
                <img src="assets/images/The-Metropolitan-Museum-of-Art/European_Paintings_teaser.png" class="d-block w-100 carousel-img">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls1" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls1" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
